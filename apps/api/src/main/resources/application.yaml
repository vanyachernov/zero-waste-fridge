spring:
  application:
    name: zwf-api
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/zwf}
    username: ${DB_USER:zwf}
    password: ${DB_PASSWORD:zwf}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    # Звичайна сесія: 12 год неактивності, cookie до закриття браузера.
    # «Запам'ятати мене» (B-03) подовжує конкретну сесію до 30 днів і робить cookie постійною.
    timeout: 12h
    jdbc:
      # Таблиці SPRING_SESSION створює Flyway (V1__spring_session.sql)
      initialize-schema: never
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    session:
      cookie:
        name: ZWF_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

zwf:
  # Адреса сайту для посилань у листах (prod: обов'язково через PUBLIC_URL)
  public-url: ${PUBLIC_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:Zero Waste Fridge <no-reply@zerowastefridge.app>}
  auth:
    password-reset-ttl: 1h
    password-reset-cooldown: 1m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
