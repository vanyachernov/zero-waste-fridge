<!--/* Спільні частини HTML-листів: шапка з логотипом і підвал. Кольори — з UI Kit (primary #006948). */-->
<th:block th:fragment="header">
  <div style="font:700 18px/1.3 Inter,Arial,sans-serif;color:#006948;margin:0 0 24px">🌿 Zero Waste Fridge</div>
</th:block>
<th:block th:fragment="button(href, label)">
  <p style="margin:24px 0"><a th:href="${href}" th:text="${label}"
     style="display:inline-block;padding:12px 24px;background:#006948;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600"></a></p>
</th:block>
<th:block th:fragment="footer">
  <p style="margin:32px 0 0;color:#6e7a72;font-size:12px">Zero Waste Fridge — менше викинутої їжі, більше врятованих продуктів.</p>
</th:block>
