<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title th:text="${subject}">Відновлення пароля</title></head>
<body style="margin:0;padding:24px;background:#f6f9f7;font:400 15px/1.5 Inter,Arial,sans-serif;color:#171d1a">
<div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
  <th:block th:replace="~{layout.html :: header}"></th:block>
  <p>Вітаємо, <span th:text="${name}">Олена</span>!</p>
  <p>Ми отримали запит на відновлення пароля до Zero Waste Fridge.</p>
  <th:block th:replace="~{layout.html :: button(${link}, 'Задати новий пароль')}"></th:block>
  <p style="color:#6e7a72">Посилання діє <span th:text="${minutes}">60</span> хв. Якщо ви не надсилали запит — просто проігноруйте цей лист, пароль не зміниться.</p>
  <th:block th:replace="~{layout.html :: footer}"></th:block>
</div>
</body>
</html>
