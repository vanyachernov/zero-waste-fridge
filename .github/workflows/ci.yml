name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Версія pnpm береться з поля packageManager у package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm turbo run typecheck --cache-dir=.turbo/cache

      - name: Frontend tests (unit + integration)
        run: pnpm turbo run test --filter=@zwf/web-lms-tests --cache-dir=.turbo/cache

      - name: Build web apps
        run: pnpm turbo run build --filter=@zwf/web-public --filter=@zwf/web-lms --cache-dir=.turbo/cache

      - name: Upload web bundles
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/web-public/out
            apps/web-lms/dist

  api:
    name: API (test + bootJar)
    # Тимчасово вимкнено: бекенд-тести (Testcontainers) займають багато часу на кожен PR.
    # Увімкнути: Settings → Secrets and variables → Actions → Variables → API_CI = true,
    # або запустити вручну (Actions → CI → Run workflow). Локально: pnpm --filter @zwf/api test.
    if: vars.API_CI == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Gradle беремо з офіційного Docker-образу, а не через ./gradlew:
      # хостинг дистрибутивів (services.gradle.org → GitHub Releases) буває недоступним (504),
      # а Docker Hub із раннерів GitHub стабільний. Версія та сама, що у wrapper.
      - name: Install Gradle (з образу gradle:<version>-jdk25)
        working-directory: .
        run: |
          GRADLE_VERSION=$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' apps/api/gradle/wrapper/gradle-wrapper.properties)
          echo "Gradle ${GRADLE_VERSION}"
          cid=$(docker create "gradle:${GRADLE_VERSION}-jdk25")
          docker cp "$cid:/opt/gradle" "$RUNNER_TEMP/gradle"
          docker rm "$cid" > /dev/null
          echo "$RUNNER_TEMP/gradle/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps

      # Testcontainers використовує Docker, який уже є на ubuntu-latest
      - name: Unit tests
        run: gradle test --console=plain

      - name: Integration tests
        run: gradle integrationTest --console=plain

      - name: Build jar (з вбудованим фронтендом)
        run: gradle bootJar -PrequireWeb --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: apps/api/build/reports/tests/

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: zwf-api-jar
          retention-days: 7
          path: apps/api/build/libs/zwf-api.jar
