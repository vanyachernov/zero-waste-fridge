name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Версія pnpm береться з поля packageManager у package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm turbo run typecheck --cache-dir=.turbo/cache

      - name: Build web apps
        run: pnpm turbo run build --filter=@zwf/web-public --filter=@zwf/web-lms --cache-dir=.turbo/cache

      - name: Upload web bundles
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/web-public/out
            apps/web-lms/dist

  api:
    name: API (test + bootJar)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps

      # Testcontainers використовує Docker, який уже є на ubuntu-latest
      - name: Test
        run: ./gradlew test --console=plain

      - name: Build jar (з вбудованим фронтендом)
        run: ./gradlew bootJar -PrequireWeb --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: apps/api/build/reports/tests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: zwf-api-jar
          retention-days: 7
          path: apps/api/build/libs/zwf-api.jar
